[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manoj-bot"
version = "0.1.0"
description = "A modular trading bot: backtesting, paper trading and live trading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.0"]
stocks = ["yfinance>=0.2.40"]
all = ["ccxt>=4.0", "yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
manoj-bot = "manoj_bot.cli:main"

[tool.setuptools.packages.find]
include = ["manoj_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
